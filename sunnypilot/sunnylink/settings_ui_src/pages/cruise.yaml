# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: passing_assist
  title: Passing Assist
  description: Longitudinal boost during a highway lane change
  enablement:
  - $ref: '#/macros/longitudinal'
  items:
  - key: LaneChangeAssistEnabled
    widget: toggle
    title: Passing Assist
    description: When you signal a lane change at highway speed while following a slower car, briefly close the follow gap, add
      an acceleration boost, and allow a small overspeed to help complete the pass. Falls back to your normal follow distance
      if you don't change lanes.
    enablement:
    - $ref: '#/macros/longitudinal'
  sub_panels:
  - id: passing_assist_settings
    label: Passing Assist Settings
    trigger_key: LaneChangeAssistEnabled
    trigger_condition:
      type: param
      key: LaneChangeAssistEnabled
      equals: true
    items:
    - key: LaneChangeAssistDirection
      widget: multiple_button
      title: Direction
      description: Which blinker arms the boost. Left only avoids triggering on highway exits.
      options:
      - value: 0
        label: Left Only
      - value: 1
        label: Both
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
    - key: LaneChangeAssistMinSpeed
      widget: option
      title: Minimum Speed
      description: Lowest speed at which the boost will engage.
      min: 25
      max: 70
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
    - key: LaneChangeAssistMinTFollow
      widget: option
      title: Minimum Follow Gap
      description: 'Tightest follow time-gap while passing: the car closes from your normal follow gap down to this value, then
        eases back. Lower is more aggressive. Capped at your normal gap, so this only ever tightens the follow distance, never
        loosens it.'
      min: 0.9
      max: 1.45
      step: 0.05
      unit: s
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
    - key: LaneChangeAssistAccel
      widget: option
      title: Acceleration Boost
      description: Extra acceleration allowed during the pass. Higher feels more eager; the car never exceeds its built-in
        acceleration and braking limits.
      min: 0.0
      max: 0.8
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
    - key: LaneChangeAssistOverspeed
      widget: option
      title: Overspeed Allowance
      description: How far above your set speed the car may briefly drift to complete the pass.
      min: 0
      max: 5
      step: 1
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
    - key: LaneChangeAssistDuration
      widget: option
      title: Boost Duration
      description: How long the boost lasts after you signal, then it eases back to your normal follow distance.
      min: 3
      max: 15
      step: 1
      unit: s
      enablement:
      - type: param
        key: LaneChangeAssistEnabled
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
